name: Build Windows Full Offline

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSYS2 UCRT64 (GTK4 + libadwaita)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pillow pycairo
        shell: bash

      - name: Build portable (PyInstaller)
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig"
          python -m PyInstaller --noconfirm --distpath=dist/windows --workpath=build/windows packaging/windows/FragileNotes.spec 2>&1 | tail -n 30
          ls -lh dist/windows/FragileNotes/ | head -n 20
          du -sh dist/windows/FragileNotes
        shell: msys2 {0}

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH
        shell: pwsh

      - name: Build installer (ISCC)
        run: |
          iscc packaging/windows/installer.iss
          ls -lh dist/*.exe
        shell: pwsh

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/FragileNotes-Setup-v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
