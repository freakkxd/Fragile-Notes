name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.9.6
      - name: ruff check
        run: ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy==1.13.0 types-PyYAML
      - name: mypy
        run: mypy fragilenotes || echo "mypy warnings (non-blocking for v0.1)"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (GTK for PyGObject)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 libcairo2-dev libgirepository1.0-dev pkg-config python3-dev gobject-introspection xvfb libgirepository-2.0-dev 2>/dev/null || true
          sudo apt-get install -y libgirepository-1.0-1 2>/dev/null || true
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          find /usr -name "girepository*.pc" 2>/dev/null | head -n 20
          pkg-config --list-all | grep -i girepository | head -n 20 || echo "not found in list"
          pkg-config --modversion girepository-2.0 || echo "girepository still not found"
          pkg-config --variable pc_path pkg-config | tr ':' '\n' | head -n 20
      - name: Install dependencies
        run: |
          export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/opt/hostedtoolcache/Python/3.11.16/x64/lib/pkgconfig
          pip install meson-python meson
          pip install PyYAML
          pip install PyGObject || echo "PyGObject pip failed, using system gi"
          pip install -e . --no-deps
          pip install pytest
      - name: Run tests
        run: xvfb-run -a pytest -q || xvfb-run -a python tests/run.py
