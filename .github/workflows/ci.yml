name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  cpp:
    name: cpp cmake + ctest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libsqlite3-dev pkg-config cmake
      - run: cmake -S cpp -B build/cpp
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: ./build/cpp/fragile_tests

  tauri:
    name: tauri cargo check + build + test
    runs-on: ubuntu-latest
    # A test harness that can hang forever (cf. Stage 9 redact_secrets loop)
    # must be bounded externally. 25 min covers check + build + full suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Tauri deps (Ubuntu 22.04 / 24.04 compat)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libgtk-3-dev librsvg2-dev patchelf libssl-dev libsqlite3-dev 2>&1 | tail -10 || true
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev 2>&1 | tail -10 || true
          sudo apt-get install -y -qq libsoup-3.0-dev libsoup2.4-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libsoup2.4-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libsoup-3.0-dev 2>&1 | tail -10 || true
          sudo apt-get install -y -qq libayatana-appindicator3-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libappindicator3-dev 2>&1 | tail -10 || true
          # Compat: Tauri 1.x ищет javascriptcoregtk-4.0 / webkit2gtk-4.0, а на 24.04 есть только 4.1 — делаем симлинки .pc + .so
          for p in /usr/lib/x86_64-linux-gnu/pkgconfig /usr/lib/pkgconfig /usr/share/pkgconfig; do
            [ -d "$p" ] || continue
            if [ -f "$p/javascriptcoregtk-4.1.pc" ] && [ ! -f "$p/javascriptcoregtk-4.0.pc" ]; then sudo ln -sf javascriptcoregtk-4.1.pc "$p/javascriptcoregtk-4.0.pc"; echo "linked jsc 4.1->4.0 in $p"; fi
            if [ -f "$p/webkit2gtk-4.1.pc" ] && [ ! -f "$p/webkit2gtk-4.0.pc" ]; then sudo ln -sf webkit2gtk-4.1.pc "$p/webkit2gtk-4.0.pc"; echo "linked webkit 4.1->4.0 in $p"; fi
            if [ -f "$p/webkit2gtk-web-extension-4.1.pc" ] && [ ! -f "$p/webkit2gtk-web-extension-4.0.pc" ]; then sudo ln -sf webkit2gtk-web-extension-4.1.pc "$p/webkit2gtk-web-extension-4.0.pc"; echo "linked webext 4.1->4.0 in $p"; fi
          done
          # .so симлинки для линкера
          if [ -f /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so ] && [ ! -f /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so ]; then sudo ln -sf libwebkit2gtk-4.1.so /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so; echo "linked libwebkit so"; fi
          if [ -f /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so ] && [ ! -f /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.0.so ]; then sudo ln -sf libjavascriptcoregtk-4.1.so /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.0.so; echo "linked libjsc so"; fi
          # также .so.0 варианты
          [ -f /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 ] && [ ! -f /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so.0 ] && sudo ln -sf libwebkit2gtk-4.1.so.0 /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.0.so.0 || true
          [ -f /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so.0 ] && [ ! -f /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.0.so.0 ] && sudo ln -sf libjavascriptcoregtk-4.1.so.0 /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.0.so.0 || true
          sudo ldconfig 2>&1 | head -5 || true
          pkg-config --modversion webkit2gtk-4.1 2>&1 | head -1 || pkg-config --modversion webkit2gtk-4.0 2>&1 | head -1 || echo "webkit not found"
          pkg-config --modversion javascriptcoregtk-4.1 2>&1 | head -1 || pkg-config --modversion javascriptcoregtk-4.0 2>&1 | head -1 || echo "jsc not found"
          pkg-config --modversion libsoup-2.4 2>&1 | head -1 || pkg-config --modversion libsoup-3.0 2>&1 | head -1 || echo "soup not found"
          ls -l /usr/lib/x86_64-linux-gnu/libwebkit* /usr/lib/x86_64-linux-gnu/libjavascript* 2>&1 | head -10 || true
      - name: Build frontend first (required for Tauri distDir)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          ls -lh frontend/dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: cargo test (full suite, externally bounded by job timeout)
        run: timeout 20m cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=4
