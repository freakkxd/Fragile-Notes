name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  cpp:
    name: cpp cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libsqlite3-dev pkg-config cmake
      - run: cmake -S cpp -B build/cpp
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: ./build/cpp/fragile_tests

  tauri:
    name: tauri cargo check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Tauri deps (Ubuntu 22.04 / 24.04 compat)
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04 (webkit 4.1 / soup3) fallback to 22.04 (4.0 / soup2.4)
          sudo apt-get install -y -qq pkg-config libgtk-3-dev librsvg2-dev patchelf \
            libssl-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev 2>&1 | tail -20 || \
          sudo apt-get install -y -qq pkg-config libgtk-3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev \
            libappindicator3-dev 2>&1 | tail -20 || true
          pkg-config --modversion webkit2gtk-4.1 2>&1 | head -1 || pkg-config --modversion webkit2gtk-4.0 2>&1 | head -1 || echo "webkit not found"
      - name: Build frontend first (required for Tauri distDir)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          ls -lh frontend/dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
