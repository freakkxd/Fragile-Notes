name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  cpp:
    name: cpp cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libsqlite3-dev pkg-config cmake
      - run: cmake -S cpp -B build/cpp
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: ./build/cpp/fragile_tests

  tauri:
    name: tauri cargo check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.0-dev libsoup2.4-dev libjavascriptcoregtk-4.0-dev libgtk-3-dev pkg-config
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npm --prefix frontend run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml
