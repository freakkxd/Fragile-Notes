name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  cpp:
    name: cpp cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libsqlite3-dev pkg-config cmake
      - run: cmake -S cpp -B build/cpp
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: ./build/cpp/fragile_tests

  tauri:
    name: tauri cargo check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Tauri deps (Ubuntu 22.04 / 24.04 compat)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libgtk-3-dev librsvg2-dev patchelf libssl-dev libsqlite3-dev 2>&1 | tail -10 || true
          # webkit 4.1 (24.04) or 4.0 (22.04) — ставим оба варианта
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev 2>&1 | tail -10 || true
          # Tauri 1.x тянет soup2-sys (2.4) даже на 24.04, поэтому ставим ОБЕ версии soup
          sudo apt-get install -y -qq libsoup-3.0-dev libsoup2.4-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libsoup2.4-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libsoup-3.0-dev 2>&1 | tail -10 || true
          sudo apt-get install -y -qq libayatana-appindicator3-dev 2>&1 | tail -10 || sudo apt-get install -y -qq libappindicator3-dev 2>&1 | tail -10 || true
          pkg-config --modversion webkit2gtk-4.1 2>&1 | head -1 || pkg-config --modversion webkit2gtk-4.0 2>&1 | head -1 || echo "webkit not found"
          pkg-config --modversion libsoup-2.4 2>&1 | head -1 || pkg-config --modversion libsoup-3.0 2>&1 | head -1 || echo "soup not found"
      - name: Build frontend first (required for Tauri distDir)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          ls -lh frontend/dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
