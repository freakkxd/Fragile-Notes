name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.9.6
      - name: ruff check
        run: ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install mypy==1.13.0 types-PyYAML
      - name: mypy
        run: mypy fragilenotes || echo "mypy warnings (non-blocking for v0.1)"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (GTK for PyGObject)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 libcairo2-dev libgirepository1.0-dev pkg-config python3-dev gobject-introspection xvfb > /dev/null
          pkg-config --modversion girepository-2.0 | head -n 1
      - name: Install dependencies
        run: |
          export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/opt/hostedtoolcache/Python/3.12.8/x64/lib/pkgconfig
          pip install meson-python meson
          pip install PyYAML
          pip install PyGObject || echo "PyGObject pip failed, using system gi"
          pip install -e . --no-deps
          pip install pytest
      - name: Run tests
        run: xvfb-run -a pytest -q
        env:
          PYTHONPATH: .:/usr/lib/python3/dist-packages
