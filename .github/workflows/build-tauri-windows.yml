name: Build Tauri Windows Installer

on:
  push:
    tags: ["v*"]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build C++ core (check) — optional on Windows
        shell: bash
        continue-on-error: true
        run: |
          cmake -S cpp -B build/cpp 2>&1 | head -20 || echo "cmake not available on Windows — cpp checked on Linux CI"
          cmake --build build/cpp 2>&1 | tail -10 || true
          ctest --test-dir build/cpp --output-on-failure 2>&1 | tail -10 || true
          echo "cpp check done (non-blocking on Windows)"

      - name: Install WiX Toolset (for MSI)
        shell: powershell
        continue-on-error: true
        run: |
          choco install wixtoolset -y --no-progress 2>&1 | tail -20 || echo "WiX install skip"
          nsis --version 2>&1 | head -5 || makensis -VERSION 2>&1 | head -5 || echo "NSIS check"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri bundle (NSIS + MSI)
        run: cargo tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: List bundles
        shell: bash
        run: |
          ls -R src-tauri/target/release/bundle/ 2>&1 | head -100
          du -sh src-tauri/target/release/bundle/* 2>&1 | head -20
          ls -lh src-tauri/target/release/bundle/nsis/* 2>&1 | head -20 || true
          ls -lh src-tauri/target/release/bundle/msi/* 2>&1 | head -20 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: false
