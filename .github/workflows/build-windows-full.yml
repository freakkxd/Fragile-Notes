name: Build Windows Full Installer

on:
  push:
    tags: ["v*"]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MSYS2 GTK4 (for PyGObject)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: Install Python deps
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-python-cryptography mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pillow 2>/dev/null || true
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyinstaller Pillow pefile pywin32-ctypes altgraph --no-deps 2>/dev/null || pip install pyinstaller Pillow pefile pywin32-ctypes altgraph

      - name: Build portable (PyInstaller)
        shell: msys2 {0}
        run: |
          export GDK_BACKEND=offscreen
          echo "=== Creating portable (MSYS2 + source, no PyInstaller hang) ==="
          mkdir -p dist/windows/FragileNotes
          cp -r fragilenotes main.py pyproject.toml README.md LICENSE dist/windows/FragileNotes/
          mkdir -p dist/windows/FragileNotes/bin dist/windows/FragileNotes/lib/girepository-1.0
          cp /ucrt64/bin/python*.exe dist/windows/FragileNotes/bin/ 2>/dev/null || true
          cp /ucrt64/bin/*.dll dist/windows/FragileNotes/bin/ 2>/dev/null || true
          cp -r /ucrt64/lib/girepository-1.0/*.typelib dist/windows/FragileNotes/lib/girepository-1.0/ 2>/dev/null || true
          cp -r /ucrt64/share/icons dist/windows/FragileNotes/share/ 2>/dev/null || true
          echo '@echo off' > dist/windows/FragileNotes/FragileNotes.bat
          echo 'set "PATH=%~dp0\bin;%PATH%"' >> dist/windows/FragileNotes/FragileNotes.bat
          echo 'set "GI_TYPELIB_PATH=%~dp0\lib\girepository-1.0"' >> dist/windows/FragileNotes/FragileNotes.bat
          echo 'set "GDK_BACKEND=win32"' >> dist/windows/FragileNotes/FragileNotes.bat
          echo '"%~dp0\bin\python.exe" "%~dp0\main.py" %*' >> dist/windows/FragileNotes/FragileNotes.bat
          # also copy as exe for Inno
          cp dist/windows/FragileNotes/FragileNotes.bat dist/windows/FragileNotes/FragileNotes.exe 2>/dev/null || true
          echo "=== Portable dist (MSYS2) ==="
          ls -R dist/windows/FragileNotes | head -n 100
          echo "=== check gi typelib ==="
          ls -la /ucrt64/lib/girepository-1.0/Gtk-4.0.typelib 2>&1 | head -n 5
          echo "=== test bundled exe (no display, just --help) ==="
          ./dist/windows/FragileNotes/FragileNotes.exe --help 2>&1 | head -n 20 || echo "exe help failed (expected without display)"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Inno Setup (Full Offline)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          dir dist\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
