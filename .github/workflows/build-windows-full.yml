name: Build Windows Full Installer

on:
  push:
    tags: ["v*"]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MSYS2 GTK4 (for PyGObject)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: Install Python deps
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-python-cryptography mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pillow 2>/dev/null || true
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyinstaller Pillow pefile pywin32-ctypes altgraph --no-deps 2>/dev/null || pip install pyinstaller Pillow pefile pywin32-ctypes altgraph

      - name: Build portable (PyInstaller)
        shell: msys2 {0}
        run: |
          export GDK_BACKEND=offscreen
          MSYS_ROOT=$(cygpath -w /)
          echo "MSYS_ROOT $MSYS_ROOT"
          UCRT_ROOT=$(cygpath -w /ucrt64)
          echo "UCRT_ROOT $UCRT_ROOT"
          ls -lh /ucrt64/bin/libstdc++-6.dll 2>&1 | head -n 5 || true
          ls -lh /ucrt64/lib/girepository-1.0/Gtk-4.0.typelib 2>&1 | head -n 5 || true
          echo "=== PyInstaller Full Offline (bundled GTK + gcc) ==="
          python -m PyInstaller --noconfirm --windowed --name="FragileNotes" \
            --hidden-import="gi" --hidden-import="gi.repository.Gtk" --hidden-import="gi.repository.Adw" --hidden-import="gi.repository.Gio" --hidden-import="gi.repository.GLib" --hidden-import="gi.repository.Gdk" --hidden-import="gi.repository.Gsk" --hidden-import="gi.repository.Pango" --hidden-import="gi.repository.PangoCairo" --hidden-import="gi.repository.Graphene" --hidden-import="gi.repository.cairo" \
            --hidden-import="yaml" --hidden-import="cryptography" \
            --add-binary "$UCRT_ROOT/bin/libstdc++-6.dll;." --add-binary "$UCRT_ROOT/bin/libgcc_s_seh-1.dll;." --add-binary "$UCRT_ROOT/bin/libwinpthread-1.dll;." \
            --add-data "$UCRT_ROOT/lib/girepository-1.0/Gtk-4.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Gdk-4.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Adw-1.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Gio-2.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/GLib-2.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Gsk-4.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Graphene-1.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/Pango-1.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/PangoCairo-1.0.typelib;gi/repository" --add-data "$UCRT_ROOT/lib/girepository-1.0/cairo-1.0.typelib;gi/repository" \
            --collect-data gi \
            main.py --distpath="dist/windows" --workpath="build/windows" --log-level=WARN
          echo "=== Dist ==="
          ls -lh dist/windows/FragileNotes/FragileNotes.exe 2>&1 | head -n 5 || true
          ls -R dist/windows/FragileNotes | head -n 30 || true

      - name: Compile C++ installer helper
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc 2>/dev/null || true
          g++ -O2 -std=c++17 -o packaging/windows/installer_helper.exe packaging/windows/installer_helper.cpp -lole32 -lshell32
          ls -lh packaging/windows/installer_helper.exe || echo "g++ not found, trying system g++"
          which g++ || echo "no g++"
          g++ --version 2>&1 | head -n 5 || true

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Inno Setup (Full Offline)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          dir dist\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
