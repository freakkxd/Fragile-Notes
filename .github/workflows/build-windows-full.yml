name: Build Windows Full Installer

on:
  push:
    tags: ["v*"]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MSYS2 GTK4 (for PyGObject)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: Install Python deps
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-python-cryptography mingw-w64-ucrt-x86_64-python-yaml mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pillow 2>/dev/null || true
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyinstaller Pillow pefile pywin32-ctypes altgraph --no-deps 2>/dev/null || pip install pyinstaller Pillow pefile pywin32-ctypes altgraph

      - name: Build portable (PyInstaller)
        shell: msys2 {0}
        run: |
          python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print('GTK OK')"
          python -m PyInstaller --noconfirm --windowed --name="FragileNotes" --collect-all gi --collect-data gi --hidden-import="gi" --hidden-import="gi.repository.Gtk" --hidden-import="gi.repository.Adw" --hidden-import="gi.repository.Gio" --hidden-import="gi.repository.GLib" --hidden-import="gi.repository.Gdk" --hidden-import="gi.repository.Pango" --hidden-import="yaml" --hidden-import="cryptography" --hidden-import="PIL" main.py --distpath="dist/windows" --workpath="build/windows"
          echo "=== PyInstaller dist ==="
          ls -R dist/windows/FragileNotes | head -n 100
          echo "=== check gi typelib ==="
          ls -la /ucrt64/lib/girepository-1.0/Gtk-4.0.typelib 2>&1 | head -n 5
          echo "=== test bundled exe (no display, just --help) ==="
          ./dist/windows/FragileNotes/FragileNotes.exe --help 2>&1 | head -n 20 || echo "exe help failed (expected without display)"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Inno Setup (Full Offline)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          dir dist\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
