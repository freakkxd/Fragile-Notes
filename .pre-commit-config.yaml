repos:
  - repo: local
    hooks:
      - id: vault-protection
        name: vault protection - block personal notes
        entry: python tools/vault_guard.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests/|tools/)
