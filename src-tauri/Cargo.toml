[package]
name = "fragile-notes"
version = "0.5.6"
description = "Fragile Notes — Obsidian-like vault, C++ core + Tauri + React"
authors = ["freakkxd <zxcerega666@gmail.com>"]
license = "MIT"
repository = "https://github.com/freakkxd/Fragile-Notes"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "dialog-all", "fs-all", "path-all", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
keyring = "2.3"
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
