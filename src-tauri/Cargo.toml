[package]
name = "fragile-notes"
version = "0.4.1"
description = "Fragile Notes — Obsidian-like vault, C++ core + Tauri + React"
authors = ["freakkxd <zxcerega666@gmail.com>"]
license = "MIT"
repository = "https://github.com/freakkxd/Fragile-Notes"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
once_cell = "1.19"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
